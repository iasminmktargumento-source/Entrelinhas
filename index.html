<!-- Filtro de refração do liquid glass (Chromium); nos outros navegadores o vidro fica fosco -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="lg-refract" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.006 0.011" numOctaves="2" seed="11" result="noise"/>
    <feGaussianBlur in="noise" stdDeviation="2.4" result="soft"/>
    <feDisplacementMap in="SourceGraphic" in2="soft" scale="42" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
<canvas id="atmo" aria-hidden="true"></canvas>
<div id="wall" aria-hidden="true"></div>
<div id="app">
  <div class="boot glass" id="boot">
    <div class="boot-mark">Entrelinhas</div>
    <div class="boot-sub">Abrindo seus livros…</div>
  </div>
</div>
<div id="layer-float"></div>
<div id="layer-modal"></div>
<div id="layer-toast" aria-live="polite"></div>
